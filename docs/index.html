<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigilancia científica</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d2321;--muted:#5f6b66;--line:#e3e1da;--acc:#1f6f50;--acc-soft:#e2f0e9;--star:#c08a16;--chip:#eef0ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--card:#1c211f;--ink:#e8ece9;--muted:#9aa6a0;--line:#2c3330;--acc:#5fc79a;--acc-soft:#1f3329;--star:#e0b040;--chip:#252b28}}
:root[data-theme="dark"]{--bg:#141816;--card:#1c211f;--ink:#e8ece9;--muted:#9aa6a0;--line:#2c3330;--acc:#5fc79a;--acc-soft:#1f3329;--star:#e0b040;--chip:#252b28}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:28px 16px 12px;max-width:1080px;margin:auto}
h1{margin:0;font-size:26px;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:4px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.controls{max-width:1080px;margin:auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=search]{flex:1 1 220px;min-width:0}
button{cursor:pointer}button.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
main{max-width:1080px;margin:auto;padding:12px 16px 60px}
.stats{color:var(--muted);font-size:13px;margin:6px 0 14px}
.day{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card.read{opacity:.55}
.top{display:flex;gap:8px;align-items:flex-start}
.title{font-weight:600;font-size:16px;color:var(--ink);text-decoration:none;flex:1}
.title:hover{color:var(--acc)}
.meta{color:var(--muted);font-size:13px;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{background:var(--chip);border-radius:20px;padding:1px 9px;font-size:12px;color:var(--muted)}
.chip.t{background:var(--acc-soft);color:var(--acc)}
.stars{color:var(--star);font-size:13px;white-space:nowrap}
.sum{margin:8px 0 0}
.why{margin:4px 0 0;font-size:14px;color:var(--muted)}
.why b{color:var(--ink);font-weight:600}
.act{display:flex;gap:4px}
.act button{padding:3px 8px;font-size:13px}
.fts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ft{font-size:13px;font-weight:600;text-decoration:none;border-radius:8px;padding:5px 10px;border:1px solid var(--line)}
.ft.open{background:var(--acc);color:var(--card);border-color:var(--acc)}
.ft.closed{color:var(--ink)}
.ft.alt{color:var(--muted)}
.ft:hover{filter:brightness(1.08)}
.empty{color:var(--muted);text-align:center;padding:60px 0}
@media (max-width:600px){h1{font-size:22px}.top{flex-wrap:wrap}}
</style>
</head>
<body>
<header>
  <h1>Vigilancia científica</h1>
  <div class="sub">Pedagogía no lineal · Sistemas complejos · Fútbol · Aprendizaje motor y talento</div>
</header>
<div class="bar"><div class="controls">
  <input type="search" id="q" placeholder="Buscar título, autor, revista, resumen…">
  <select id="topic"><option value="">Todos los temas</option>
    <option value="pedagogia_no_lineal">Pedagogía no lineal / CLA</option>
    <option value="sistemas_complejos">Sistemas complejos</option>
    <option value="futbol">Fútbol</option>
    <option value="aprendizaje_talento">Aprendizaje y talento</option></select>
  <select id="type"><option value="">Todos los tipos</option>
    <option value="article">Artículos</option><option value="preprint">Preprints</option>
    <option value="book">Libros</option><option value="thesis">Tesis</option>
    <option value="event">Seminarios / congresos</option><option value="news">Noticias</option></select>
  <select id="lang"><option value="">Idiomas</option><option>en</option><option>es</option><option>pt</option><option>ca</option></select>
  <select id="rel"><option value="1">★ todos</option><option value="3">★★★+</option><option value="4">★★★★+</option><option value="5">★★★★★</option></select>
  <button id="fav">☆ Favoritos</button>
  <button id="unread">Sin leer</button>
  <button id="bib">⬇ BibTeX</button>
</div></div>
<main><div class="stats" id="stats"></div><div id="list"></div></main>
<script>
const T={pedagogia_no_lineal:"Pedagogía no lineal",sistemas_complejos:"Sistemas complejos",futbol:"Fútbol",aprendizaje_talento:"Aprendizaje y talento"};
const K={article:"Artículo",preprint:"Preprint",book:"Libro",thesis:"Tesis",event:"Evento",news:"Noticia"};
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||"{}")}catch(e){return{}}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let items=[],read=store.get("vb_read"),favs=store.get("vb_fav"),onlyFav=false,onlyUnread=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function filtered(){
  const q=$("q").value.toLowerCase().trim(),tp=$("topic").value,ty=$("type").value,lg=$("lang").value,r=+$("rel").value;
  return items.filter(it=>(!tp||(it.topics||[]).includes(tp))&&(!ty||it.type===ty)&&(!lg||it.lang===lg)&&(it.relevance||0)>=r
    &&(!onlyFav||favs[it.id])&&(!onlyUnread||!read[it.id])
    &&(!q||[it.title,(it.authors||[]).join(" "),it.venue,it.summary,it.abstract].join(" ").toLowerCase().includes(q)));
}
function ftLinks(it){
  const u=it.fulltext_url||it.url; if(!u) return "";
  const isDoc=!["news","event"].includes(it.type);
  let main;
  if(!isDoc) main=`<a class="ft open" href="${esc(u)}" target="_blank" rel="noopener">🌐 ${it.type==="event"?"Ver evento":"Leer completo"}</a>`;
  else if(it.oa) main=`<a class="ft open" href="${esc(u)}" target="_blank" rel="noopener">📄 Leer artículo completo${it.fulltext_kind==="pdf"?" (PDF)":""} · acceso abierto</a>`;
  else main=`<a class="ft closed" href="${esc(u)}" target="_blank" rel="noopener">🔒 Texto completo en la editorial (puede requerir suscripción)</a>`;
  const sch=isDoc&&!it.oa&&it.scholar_url?`<a class="ft alt" href="${esc(it.scholar_url)}" target="_blank" rel="noopener">🔎 Buscar versión gratuita</a>`:"";
  return `<div class="fts">${main}${sch}</div>`;
}
function render(){
  const list=filtered();
  $("stats").textContent=`${list.length} de ${items.length} ítems · ${Object.keys(favs).length} favoritos`;
  if(!list.length){$("list").innerHTML=`<div class="empty">${items.length?"Nada coincide con los filtros.":"Aún no hay ítems: la primera ejecución diaria los añadirá."}</div>`;return}
  let html="",day="";
  for(const it of list){
    if(it.found!==day){day=it.found;html+=`<div class="day">${new Date(day+"T12:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>`}
    const au=(it.authors||[]);const auS=au.slice(0,3).join(", ")+(au.length>3?" et al.":"");
    const ev=it.type==="event"&&it.event_date?` · 📅 ${esc(it.event_date)}${it.location?" · "+esc(it.location):""}`:"";
    html+=`<article class="card ${read[it.id]?"read":""}"><div class="top">
      <a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
      <span class="stars" title="Relevancia">${"★".repeat(it.relevance||0)}</span>
      <span class="act"><button data-f="${esc(it.id)}" title="Favorito">${favs[it.id]?"★":"☆"}</button><button data-r="${esc(it.id)}" title="Marcar leído">${read[it.id]?"↺":"✓"}</button></span></div>
      <div class="meta">${esc(auS)}${auS&&it.venue?" — ":""}<i>${esc(it.venue)}</i>${it.date?" · "+esc(it.date):""}${ev}</div>
      ${it.summary?`<p class="sum">${esc(it.summary)}</p>`:""}
      ${it.why?`<p class="why"><b>Por qué importa:</b> ${esc(it.why)}</p>`:""}
      ${it.practice&&it.practice!=="—"?`<p class="why"><b>Aplicación práctica:</b> ${esc(it.practice)}</p>`:""}
      ${ftLinks(it)}
      <div class="chips"><span class="chip">${K[it.type]||esc(it.type)}</span>${it.lang?`<span class="chip">${esc(it.lang)}</span>`:""}${(it.topics||[]).map(t=>`<span class="chip t">${T[t]||esc(t)}</span>`).join("")}${it.doi?`<span class="chip">doi:${esc(it.doi)}</span>`:""}</div>
    </article>`;
  }
  $("list").innerHTML=html;
}
document.addEventListener("click",e=>{
  const f=e.target.closest("[data-f]"),r=e.target.closest("[data-r]");
  if(f){const id=f.dataset.f;favs[id]?delete favs[id]:favs[id]=1;store.set("vb_fav",favs);render()}
  if(r){const id=r.dataset.r;read[id]?delete read[id]:read[id]=1;store.set("vb_read",read);render()}
});
["q","topic","type","lang","rel"].forEach(id=>$(id).addEventListener("input",render));
$("fav").onclick=()=>{onlyFav=!onlyFav;$("fav").classList.toggle("on",onlyFav);render()};
$("unread").onclick=()=>{onlyUnread=!onlyUnread;$("unread").classList.toggle("on",onlyUnread);render()};
$("bib").onclick=()=>{location.href="biblioteca.bib"};
fetch("items.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{items=d;render()}).catch(()=>{$("list").innerHTML='<div class="empty">No se pudo cargar items.json</div>'});
</script>
</body>
</html>
